name: Deploy Hello Test

on:
  push:
    branches: [ "win" ]

jobs:
  deploy:
    runs-on: [self-hosted, will-hello]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          path: .

      - name: Crear directorio si no existe
        run: mkdir -p /opt/docker/hello-test

      - name: Limpiar deploy anterior
        run: rm -rf /opt/docker/hello-test/*

      - name: Copiar archivos del proyecto
        run: cp -r ./* /opt/docker/hello-test/
